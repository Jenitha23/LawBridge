name: LawBridge Backend CI

on:
  push:
    branches:
      - '**'

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: |
          dotnet restore LawBridge.Backend/LawBridge.Backend.csproj

      - name: Build backend
        run: |
          dotnet build LawBridge.Backend/LawBridge.Backend.csproj \
            --configuration Release \
            --no-restore

      - name: Docker smoke build
        run: |
          docker build \
            -t lawbridge-backend-ci:latest \
            -f LawBridge.Backend/Dockerfile \
            LawBridge.Backend