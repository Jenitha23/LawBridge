name: LawBridge Backend CD

on:
  workflow_run:
    workflows:
      - "LawBridge Backend CI"
    types:
      - completed

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Azure App Service
    runs-on: ubuntu-latest

    steps:
      - name: Check CI result
        run: |
          echo "CI workflow: ${{ github.event.workflow_run.name }}"
          echo "CI conclusion: ${{ github.event.workflow_run.conclusion }}"
          echo "CI branch: ${{ github.event.workflow_run.head_branch }}"
          echo "CI commit: ${{ github.event.workflow_run.head_sha }}"

      - name: Verify CI succeeded
        if: ${{ github.event.workflow_run.conclusion != 'success' }}
        run: |
          echo "CI failed. Deployment cancelled."
          exit 1

      - name: Verify main branch
        if: ${{ github.event.workflow_run.head_branch != 'main' }}
        run: |
          echo "CI was not run from main. Deployment cancelled."
          exit 1

      - name: Deploy Docker image to Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: lawbridge-backend
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: docker.io/jenithamaxi23/lawbridge-backend:${{ github.event.workflow_run.head_sha }}