name: LawBridge Backend CD

on:
  workflow_run:
    workflows:
      - "LawBridge Backend CI"
    types:
      - completed
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Azure App Service
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      # Deploy the exact Docker image created by CI
      - name: Deploy Docker image to Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: lawbridge-backend
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: docker.io/jenithamaxi23/lawbridge-backend:${{ github.event.workflow_run.head_sha }}