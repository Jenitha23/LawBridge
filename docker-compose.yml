services:

  # ===============================
  # backend (ASP.NET Core Web API)
  # ===============================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: LawBridge-backend
    ports:
      - "5176:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=LawBridge;Username=${MAIN_DB_USER:-postgres};Password=${MAIN_DB_PASSWORD:-postgres}"
      ConnectionStrings__RagConnection: "Host=pgvector;Port=5432;Database=LawBridgeRAG;Username=${RAG_DB_USER:-postgres};Password=${RAG_DB_PASSWORD:-postgres}"
      Jwt__Key: ${JWT_KEY:-ChangeThisToALongRandomDevelopmentOnlySecret123}
      Jwt__Issuer: LawBridge
      Jwt__Audience: LawBridgeUsers
      Jwt__ExpireMinutes: "60"
      Gemini__ApiKey: ${GEMINI_API_KEY}
      Gemini__EmbeddingModel: gemini-embedding-001
      Gemini__EmbeddingDimensions: "1536"
      Gemini__ChatModel: gemini-3.1-flash-lite
    depends_on:
      postgres:
        condition: service_healthy
      pgvector:
        condition: service_healthy
    networks:
      - lawbridge-net
    restart: unless-stopped

  # ===============================
  # postgres (Main Database: users, chats, profiles, documents)
  # ===============================
  postgres:
    image: postgres:17
    container_name: postgres
    environment:
      POSTGRES_DB: LawBridge
      POSTGRES_USER: ${MAIN_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${MAIN_DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - lawbridge-main-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MAIN_DB_USER:-postgres} -d LawBridge"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - lawbridge-net
    restart: unless-stopped

  # ===============================
  # pgvector (RAG Database: legal chunks, embeddings, vector search context)
  # ===============================
  pgvector:
    image: pgvector/pgvector:pg17
    container_name: pgvector
    environment:
      POSTGRES_DB: LawBridgeRAG
      POSTGRES_USER: ${RAG_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${RAG_DB_PASSWORD:-postgres}
    ports:
      - "5433:5432"
    volumes:
      - lawbridge-rag-data:/var/lib/postgresql/data
      - ./init-pgvector.sql:/docker-entrypoint-initdb.d/init-pgvector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${RAG_DB_USER:-postgres} -d LawBridgeRAG"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - lawbridge-net
    restart: unless-stopped

networks:
  lawbridge-net:
    driver: bridge

volumes:
  lawbridge-main-data:
  lawbridge-rag-data: